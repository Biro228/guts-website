<style>
:root {
  --cream: #F7F4EE;
  --charcoal: #181818;
  --yellow: #E8D42A;
  --yellow-dark: #C4B220;

}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--cream); color: var(--charcoal); font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--cream); }
::-webkit-scrollbar-thumb { background: var(--charcoal); border-radius: 3px; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 48px;
  background: rgba(247,244,238,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gray-soft);
}
.nav-back {
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.12em; color: var(--charcoal); text-decoration: none;
  display: flex; align-items: center; gap: 8px; transition: gap 0.2s;
}
.nav-back:hover { gap: 14px; }
.nav-logo { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.15em; }
.nav-cta {
  background: var(--yellow); color: var(--charcoal);
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.1em; padding: 10px 22px; border: none; cursor: pointer;
  text-decoration: none; border-radius: 8px; transition: transform 0.15s;
}
.nav-cta:hover { transform: translateY(-1px); }

#list-view, #detail-view { min-height: 100vh; }
#detail-view { display: none; }

.stories-hero {
  background: var(--charcoal); color: var(--cream);
  padding: 140px 48px 80px; text-align: center;
}
.stories-hero .label {
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.3em;
  color: var(--yellow); margin-bottom: 20px;
}
.stories-hero h1 {

}

.stories-grid {
  padding: 80px 48px;

.story-card {

  border-radius: 16px; padding: 36px 32px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
}
.story-card::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 3px;
  background: var(--yellow); transform: scaleX(0);
  transform-origin: left; transition: transform 0.3s;
}
.story-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); border-color: var(--charcoal); }
.story-card:hover::after { transform: scaleX(1); }

.card-tier {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em;
  color: var(--yellow-dark); background: rgba(232,212,42,0.1);
  border: 1px solid rgba(232,212,42,0.3); border-radius: 4px;
  padding: 4px 10px; display: inline-block; margin-bottom: 16px;
}
.card-title {

}
.card-arrow {

  font-family: 'Space Mono', monospace; font-size: 18px; color: var(--yellow-dark);
  transition: transform 0.2s;
}
.story-card:hover .card-arrow { transform: translateX(4px); }
.card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip {
  font-size: 11px; color: var(--gray-mid); background: var(--cream);
  border: 1px solid var(--gray-soft); border-radius: 99px; padding: 3px 10px;
}

.detail-nav {
  position: sticky; top: 72px; z-index: 50;
  background: rgba(247,244,238,0.95); backdrop-filter: blur(8px);

.detail-back:hover { gap: 14px; }
.detail-breadcrumb {
  font-family: 'Space Mono', monospace; font-size: 11px;
  color: var(--gray-mid); letter-spacing: 0.08em;
}

.detail-content { max-width: 760px; margin: 0 auto; padding: 64px 48px 120px; }
.detail-tier {
  font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.25em;
  color: var(--yellow-dark); background: rgba(232,212,42,0.1);
  border: 1px solid rgba(232,212,42,0.3); border-radius: 6px;
  padding: 6px 14px; display: inline-block; margin-bottom: 24px;
}
.detail-title {
  font-family: 'Black Han Sans', sans-serif;
  font-size: clamp(26px, 4vw, 48px); line-height: 1.2;
  margin-bottom: 48px; color: var(--charcoal);
}
.story-section { margin-bottom: 40px; }
.story-section-label {
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em;
  color: var(--yellow-dark); margin-bottom: 12px; display: block;
}
.story-section p {
  font-size: 15px; line-height: 1.95; color: #3a3a3a;
}
.story-divider { height: 1px; background: var(--gray-soft); margin: 36px 0; }

.story-nav-buttons {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--gray-soft);
}
.story-nav-btn {
  font-family: 'Black Han Sans', sans-serif; font-size: 15px;
  background: var(--charcoal); color: var(--yellow);
  border: none; padding: 16px 28px; border-radius: 10px;
  cursor: pointer; transition: transform 0.2s;
}
.story-nav-btn:hover { transform: translateY(-2px); }
.story-nav-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: none; }

@media (max-width: 768px) {
  nav { padding: 16px 24px; }
  .nav-back span { display: none; }
  .stories-hero { padding: 110px 24px 60px; }
  .stories-grid { padding: 48px 24px; grid-template-columns: 1fr; }
  .detail-content { padding: 48px 24px 80px; }
  .detail-nav { padding: 14px 24px; }
  .story-nav-buttons { flex-direction: column; gap: 12px; }

<script>
const STORIES = [{"id": "papa-smurf", "tier": "THE GUTS · PAPA SMURF", "title": "교사가 혹은 교사나 되어볼까 하는 아이들의 신발을 신어보기 😂", "excerpt": "저는 GUTS의 PAPA SMURF, 진구쌤입니다. 부산에 오기 전에는 네덜란드와 핀란드에서 Research Fellow로 활동했어요. 인생은 정말 랜덤박스인 것 같습니다.", "sections": [{"icon": "📌", "label": "나는 누구?", "text": "저는 GUTS의 PAPA SMURF, 진구쌤입니다. 관우가 GUTS를 시작해놓고 임용 본다고 저에게 위로 짬 때리고 도망가는 바람에, 예상치 못하게 다중 역할(관리자, 멘토 그리고 대나무숲까지 ㅠ.ㅠ)을 떠안게 되었구요. 지금은 GUTS를 멤버들이 주도하고 가꾸는 전문적 학습공동체로 다시 돌려드리는 작업을 하고 있습니다.

개인적인 이야기를 드리면, 저는 부산을 평생 관광지로만 생각하며 살다가, 특별한 인연으로 부산에 정착해 예비 및 현직 교사들에게 심리학을 가르치고 또 연구하는 노진구쌤입니다. 부산에 오기 전에는 네덜란드와 핀란드에서 Research Fellow로, 유로로 월급 받으며 생활하던 지식 외노자였어요.

저도 여러분이 꿈꾸는 학급에서 아이들과 울고 웃던 교사 중 한 명이었습니다. 졸업하고 딱 3년만 하고 대학원에 가야지 했는데, 처음 맡은 애들이 넘 이뻤습니다. Life Happens — 인생은 정말 랜덤박스인 것 같아요."}, {"icon": "💛", "label": "나에게 GUTS란?", "text": "부산에서의 삶 (GUTS is Busan to me 😊), 랜덤박스, 손 많이 가는 녀석들, 기대되는 무언가, 우리 반, 반전매력, 만나면 제일 반가운 그리고 보석같은 존재들입니다."}, {"icon": "🤬", "label": "아이씨 나갈까 & 꽈당 모먼트", "text": "할 수 있는 일을 시작한 걸까 하는 의구심에 가까웠습니다. 전문성에 대한 예비교사들의 희한한 생각, 그리고 대학에서 학생-멘토 간의 관계가 가장 큰 어려움이었어요.

이런 시행착오 덕분에 GUTS 아이들, 애칭으로 미니언즈라고 부르는, 20대를 살아가는 아이들에 대해서 깊이 이해하게 되었어요."}, {"icon": "🌱", "label": "My Ambition", "text": "가장 큰 소망은, 사랑스러운 GUTS 멤버들의 영원한 PAPA SMURF가 되어주고 싶다는 거예요. 멤버들이 앞으로 가꾸어나갈 교실에 놀러 가고, 아이들이 누구냐고 물어보면 응, 선생님의 선생님이야라는 말을 듣고 싶구요.

또래관계 분야의 연구와 현장이 좀 더 연결되었으면 하는 마음도 있어요. GUTS 친구들의 관심이 자기 반에만 머무르지 않고, 연구자와 함께 협력해서 초등교육 전체의 발전에도 기여했으면 좋겠습니다."}]}, {"id": "guts-founder", "tier": "THE GUTS Begins", "title": "GUTS를 만든 사람의 이야기", "excerpt": "2023년에 진구 교수님의 수업을 듣고, 사례 연구가 너무 재밌어서 뒷일을 생각하지 않고 이 그룹을 만든 장본인입니다.", "sections": [{"icon": "📌", "label": "나는 누구?", "text": "2023년에 진구 교수님의 수업을 듣고, 사례 연구가 너무 재밌어서 뒷일을 생각하지 않고 이 그룹을 만든 장본인입니다. 지금은 그룹을 관리해주는 하나의 Mentor로서 학생들을 키우는 일에 최선을 다하고 있습니다."}, {"icon": "💛", "label": "나에게 GUTS란?", "text": "처음의 GUTS는 제가 스스로 발전할 수 있는 자기 계발의 장소였습니다. 처음에는 제 동기들과 공휴일까지 시간을 내어서 같이 공부하고, 이야기하는 것이 정말 뜻 깊다고 생각했습니다.

두 번째는 평범한 교사가 되는 것입니다. 매년 들어오는 학생들은 다 다르니, 학생의 입장을 고려하지 않은 채 자신이 원하는 이상적인 교사상을 설정하는 것은 어불성설이라고 느껴졌어요. 그래서 저는 평범한 교사가 되기 위해서 지금도, 앞으로도 노력하는 것 같습니다."}]}, {"id": "pioneer", "tier": "THE GUTS 시조새", "title": "남들과 달라진 출발선", "excerpt": "교대는 저에게 3번째 학교였고 돌고 돌아 드디어 정착하게 되었어요. 군대에서 특이한 경험을 통해 상황이 뒤바뀌었습니다.", "sections": [{"icon": "🕺", "label": "나는 누구?", "text": "안녕하세요. 현재 백산초등학교 6학년 담임을 맡고 있는 김근효입니다.

물론 그때 들어오지 않았다면 후회했을 만큼, 약 1년 6개월이라는 시간 동안 GUTS에서 좋은 경험과 추억들을 쌓아왔습니다. GUTS는 제게 흥미 있는 일을 할 때 얼마나 즐거울 수 있는지, 또 좋은 사람들과 함께할 때 얼마나 더 엄청난 일을 할 수 있는지 알려준 곳입니다."}, {"icon": "🤸", "label": "꽈당 모먼트", "text": "가장 기억에 남는 건 해외의 교육대학교 학생들이 한국에 와서 어울릴 수 있는 기회가 있었을 때, 영어를 못해서 입 몇 번 벙긋하지 않고 오뚝이 마냥 고개만 끄덕끄덕거렸던 일입니다. 그냥 영어 듣기 평가를 하루 동안 하고 온 기분이었어요. 그 일을 계기로 그 해 여름방학에 냅다 어학 연수를 떠났던 게 기억나네요."}, {"icon": "🌱", "label": "My Ambition", "text": "사실 저는 교사가 되고 싶어서 교대에 온 케이스는 아닙니다. 원래 간호 대학을 다녔는데, 간호사가 하기 싫어서 왔어요. 그래도 앞으로의 교직 생활에서도 지금처럼 좋은 사람들과 함께 제가 관심 있는 일을 하며 즐겁게 나아가고 싶다는 바람은 있습니다. 더 많은 것을 보고, 더 많은 것을 경험하며 있을지 없을지 모를 제 Ambition을 찾는 과정도 하나의 즐거움이 될 것 같습니다."}]}, {"id": "teaching-only", "tier": "THE GUTS", "title": "교사의 역할은 잘하는 수업만?", "excerpt": "2024년, 1학년 2학기에 교수님의 수업과 워크샵을 듣고 GUTS에 합류해 활동 중인 The GUTS의 멤버입니다. 또래관계라는 새로운 관점을 제시하던 그때의 워크샵이 저에게는 새롭게 다가왔습니다.", "sections": [{"icon": "📌", "label": "나는 누구?", "text": "저는 2024년, 1학년 2학기에 교수님의 수업과 워크샵을 듣고 GUTS에 합류해 활동 중인 The GUTS의 멤버입니다. 처음에는 또래관계에 대한 흥미 반, 멋있다는 느낌 반으로 들어와 배울 점 많은 동기, 선배들을 따라 지금까지 오게 되었습니다."}, {"icon": "💛", "label": "나에게 GUTS란?", "text": "정말 학생들에게 필요한 교사란 무엇인지 같은 고민을 시작해 보게 된 사람들이 모인 곳이라 생각합니다. 강의를 듣는 일상을 반복하다 보면 가끔은 잘하는 수업 외의 학급 경영과 같은 교사 역할에 대한 인지가 흐려질 때가 많아요. 그럴 때마다 교사의 역할에 대한 넓은 시야를 가질 수 있게 해주는 곳이 GUTS인 것 같습니다."}, {"icon": "🤸", "label": "꽈당 모먼트", "text": "시작부터 지금까지 끊임없이 이어지고 있는 부분이라고 생각합니다. 처음에는 또래관계에 대해 아는 것도 정말 없었고 논문을 제대로 읽는 방법, 사례연구를 하는 방법 등 모르는 게 너무 많았고, 지금도 새로운 학급을 관찰할 때면 모르는 것들이 불쑥 등장하곤 합니다."}, {"icon": "🌱", "label": "My Ambition", "text": "학교가 아이들에게 행복한 공간이었으면 하는 마음이 가장 큰 것 같습니다. 저를 만나는 학생들도 어렸을 때의 저처럼 학교라는 공간과 선생님이라는 존재를 떠올렸을 때 좋은 기억들만 가득 떠올릴 수 있었으면 하는 마음을 가지고 교사라는 꿈을 키워가고 있습니다."}]}, {"id": "what-teacher", "tier": "THE GUTS 🧚🏻‍♀️", "title": "나는 어떤 교사가 되고 싶은가?", "excerpt": "안녕하세요. 부산교대 과학교육과 3학년 박소혜입니다. 1학년 시절 교육심리 수업을 듣고 이게 내가 대학에서 공부하고 싶었던 내용이다라는 생각이 들었고, 그렇게 GUTS에 합류하게 되었습니다.", "sections": [{"icon": "🕺", "label": "나는 누구?", "text": "안녕하세요. 현재 부산교대 과학교육과 3학년으로 재학중인 박소혜라고 합니다. 1학년 시절, 김진구 교수님의 교육심리 수업을 듣고 이게 내가 대학에서 공부하고 싶었던 내용이다!라는 생각이 들었고, 그렇게 GUTS라는 전문적학습공동체에 합류하게 되었습니다. 어느덧 3년차네요."}, {"icon": "💛", "label": "나에게 GUTS란?", "text": "GUTS는 모든 구성원들이 함께 활동을 꾸려가고 지식을 나누며 성장할 수 있는 곳입니다. 관심있는 분야와 관련한 활동들을 직접 자신의 손으로 일구고 무언가를 얻어갈 수 있다면 얼마나 좋을까요? 분명 얻기 힘든 경험일텐데 여기서는 그게 가능합니다."}, {"icon": "❤️‍🩹", "label": "꽈당 모먼트", "text": "GUTS에서 제가 가장 처음으로 한 것은 논문 읽기였습니다. 당시 막 고등학교를 졸업한 병아리였던 저는 수능 지문을 읽듯 논문을 읽었어요. 그렇게 힘겨운 삽질을 하다가 교수님과 선배님들의 말씀을 듣고 깨달았어요. 논문은 그렇게 읽는 게 아니라는 것을요. 논문이라는 건 교수님께서도 수십 번씩 읽으시며 매번 새로운 깨달음을 얻어갈 수 있는 아주 광활한 지식의 바다였던 거예요."}, {"icon": "😤", "label": "아이씨 나갈까", "text": "GUTS에서 제가 원하는 공부를 하기 위해서는 과외나 약속을 줄이고 시간을 내야한다는 걸 깨닫는 과도기가 있었습니다. 그땐 제 삶의 우선순위를 정하지 못해서 혼란스러운 감정을 느꼈어요. 지금이야 적정선을 찾아서 일과 공부 사이의 조화를 이루었지만요. 그리고 이제 제가 한 가지 확실히 말씀드릴 수 있는 건 그런 힘듦이 있었음에도 불구하고 공동체 내에 남아 있길 정말 잘했다는 것입니다."}, {"icon": "🌱", "label": "My Ambition", "text": "단순히 감으로 때려 맞추는 식의 교사가 아니라, 진짜 잘 알고 잘 다스리는 교사가 되고 싶던 저에게 또래관계는 엄청난 키워드였어요.

공부를 하면 할수록 이런 정보는 모든 교사분들이 아셔야 할 것 같은데라는 생각이 드는 순간들이 너무나도 많습니다. 그래서 저는 제가 GUTS에서 공부하고 깨달은 내용들을 꼭 교사가 되고자 하는 사람들에게 전해주고 싶어요. 교사를 가르치는 교사가 되고 싶습니다."}]}, {"id": "never-stop", "tier": "THE GUTS", "title": "We should never stop learning.", "excerpt": "안녕하세요, 저는 음악교육과 24학번 이수인입니다. 어렸을 때부터 교사가 되는 것이 꿈이었고, 더 좋은 교사가 되고 싶다는 마음을 가지고 2024년 GUTS에 합류하게 되었습니다.", "sections": [{"icon": "📌", "label": "나는 누구?", "text": "안녕하세요, 저는 음악교육과 24학번 이수인입니다. 어렸을 때부터 교사가 되는 것이 꿈이었고, 더 좋은 교사가 되고 싶다는 마음을 가지고 2024년 GUTS에 합류하게 되었습니다."}, {"icon": "💛", "label": "나에게 GUTS란?", "text": "저에게 GUTS란 좋은 사람들을 만나고, 함께 어떤 교사가 되고 싶은지 고민할 수 있는 곳입니다. 다양한 사람들과 이야기를 나누며 배우는 점이 많았고, 혼자였다면 하지 못했을 고민들도 함께 나눌 수 있었습니다. 그래서 GUTS는 저에게 계속해서 배우고 성장하게 만드는 공간입니다."}, {"icon": "🤸", "label": "꽈당 모먼트", "text": "연주회 일정과 워크샵 일정이 겹쳐 함께하지 못했던 일이 있었습니다. 참여하고 싶은 마음이 컸던 만큼 더 아쉽게 느껴졌고, 일정이 겹칠 때마다 몸이 두 개였으면 좋겠다는 생각도 했습니다. 워크샵에 참여하지 못할 것 같다고 말씀드리는 순간이 조심스럽고 무섭게 느껴졌는데, 다행히 이해해 주셔서 감사했던 기억으로 남아 있습니다."}, {"icon": "🌱", "label": "My Ambition", "text": "학생 때 또래관계로 힘들었던 시간들이 있었지만 결국 잘 이겨냈습니다. 하지만 모든 아이들이 저와 같은 방식으로 힘을 얻을 수 있는 것은 아니라는 생각이 들었고, 그래서 관계로 어려움을 겪는 아이들에게 현실적으로 도움이 될 수 있는 방법들을 고민하게 되었습니다. 서로 사랑하고 존중할 수 있도록 돕는 교사가 되고 싶습니다."}]}, {"id": "kangnam", "tier": "THE GUTS Begins ♻️", "title": "강남을 가고 싶었는데 여기가 어디..? 나는 누구..?", "excerpt": "사실 저는 대학 들어와서 동아리도 열심히 할 생각이 없던 인간인지라 굉장히 당황스러운 모임? 이라고 할 수 있겠네요. 친구따라 강남을 간게 아니라 GUTS를 창단..? 멤버에 가깝게 바뀌어버렸어요.", "sections": [{"icon": "💛", "label": "나에게 GUTS란?", "text": "사실 저는 대학 들어와서 동아리도 열심히 할 생각이 없던 인간인지라 굉장히 당황스러운 모임? 이라고 할 수 있겠네요. 저의 제목과 연관이 깊은 아이입니다.. 조금 친한 동기랑 너무 재밌고 열과 성을 다해 하나의 과제를 했었는데 하... 친구를 잘 사귀어야 합니다. ㅋㅋㅋㅋ 갑자기 사례연구 더 해보고 싶지 않냐고 물어보길래 오? 수업이 아닌데 더 해볼수 있어? 재밌긴 하겠다~~ 이러고 뭐 할거면 같이 하자~ 했던게 지금의 스노우 볼이 되었습니다...

친구따라 강남을 간게 아니라 GUTS를 창단..? 멤버에 가깝게 바뀌어버렸어요. 다들 친구를 잘 사귑시다. 근데 이것도 통계로 증명할 수 있는거 알아요? 또래선택과 또래영향이 있는데 저는 전형적으로 또래영향으로 GUTS에 들어오게 된 이슈.

function renderGrid() {
  const grid = document.getElementById('story-grid');
  grid.innerHTML = STORIES.map((s, i) => `
    <div class="story-card reveal" onclick="showDetail(${i})" style="transition-delay:${(i % 4) * 0.07}s">
      <div class="card-tier">${s.tier}</div>
      <div class="card-title">${s.title}</div>
      <p class="card-excerpt">${s.excerpt}</p>
      <div class="card-chips">${s.sections.map(sec => `<span class="chip">${sec.icon} ${sec.label}</span>`).join('')}</div>
      <div class="card-arrow">→</div>
    </div>
  `).join('');

  requestAnimationFrame(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  });
}

function showDetail(idx) {
  const s = STORIES[idx];
  document.getElementById('crumb').textContent = s.title.length > 28 ? s.title.slice(0, 28) + '…' : s.title;

  const sectionsHTML = s.sections.map((sec, i) => `
    ${i > 0 ? '<div class="story-divider"></div>' : ''}
    <div class="story-section">
      <span class="story-section-label">${sec.icon} ${sec.label.toUpperCase()}</span>
      <p>${sec.text.replace(/\n/g, '<br>')}</p>
    </div>
  `).join('');

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-tier">${s.tier}</div>
    <h2 class="detail-title">${s.title}</h2>
    ${sectionsHTML}
    <div class="story-nav-buttons">
      <button class="story-nav-btn" onclick="showDetail(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>← 이전 스토리</button>
      <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--gray-mid)">${idx + 1} / ${STORIES.length}</span>
      <button class="story-nav-btn" onclick="showDetail(${idx + 1})" ${idx === STORIES.length - 1 ? 'disabled' : ''}>다음 스토리 →</button>
    </div>
  `;

  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showList() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderGrid();
</script>
